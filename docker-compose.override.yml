services:
  localstack:
    container_name: "localstack-s3only"
    image: localstack/localstack
    networks:
      - airflow
    ports:
      - "127.0.0.1:4566:4566"
    env_file:
      - .localstack.env
    volumes:
      - "./localstack:/docker-entrypoint-initaws.d"
  postgres-cdw:
    image: postgres:latest
    env_file:
      - .postgres_cdw.env
    networks:
      - airflow
    ports:
      - "127.0.0.1:5532:5432"
    # At this time, I do not want this info to persist from run to run / build to build.
    #  (I also don't know if the volume path below will work, so...)
    # volumes:
    #   - postgres-db-volume:/var/lib/postgresql/cdw
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    networks:
      - airflow
    ports:
      - "127.0.0.1:8081:80"
    env_file:
      - .pgadmin.env